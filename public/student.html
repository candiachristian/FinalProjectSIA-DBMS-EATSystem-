<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Student events</title>
    <link rel="stylesheet" href="style.css" />
    <script src="app.js"></script>
  </head>
  <body>
    <header>
      <div class="brand">
        <span class="brand-mark">📝</span>
        <h1>Events · Student</h1>
      </div>
      <button class="secondary" onclick="logout()">Log out</button>
    </header>
    <main class="wrap">
      <section class="hero">
        <h2 id="welcome">Your campus events</h2>
        <p id="profile"></p>
      </section>
      <section id="events" class="grid"></section>
    </main>
    <script>
      requireRole("student");
      const me = system.currentStudent();
      if (!me) logout();
      $("welcome").textContent = `Hello, ${me.first} — find your next event.`;
      $("profile").textContent =
        `${me.studentId} · ${me.program || ""} · ${me.year || ""} ${me.section || ""}`;
      function draw() {
        let list = system.getEvents();
        $("events").innerHTML = list.length
          ? list
              .map((e) => {
                let a = e.attendees.find((x) => x.studentId === me.studentId),
                  status = eventStatus(e),
                  can = system.canRegister(e);
                return `<article class="panel"><div class="title-row"><h3>${esc(e.name)}</h3><span class="badge ${status}">${status}</span></div><p><b>${esc(e.date)}</b> · ${fmt12(e.start)}–${fmt12(e.end)}</p><p>${esc(e.venue)}</p><p>Your status: <span class="badge ${a ? system.attendeeStatus(e, a) : "None"}">${a ? system.attendeeStatus(e, a) : "Not registered"}</span></p>${a && a.proof ? `<p><img class="proof" src="${a.proof}" alt="Uploaded event proof"></p>` : ""}${!a && status !== "Completed" ? `<label>Event photo proof (required)</label><input type="file" id="proof-${e.id}" accept="image/*" capture="environment" ${can ? "" : "disabled"}><p class="hint">Choose a photo taken at the event. JPEG/PNG/WEBP, up to 1 MB.</p><button ${can ? "" : "disabled"} onclick="register(${e.id})">${can ? "Upload proof & register" : "Registration opens at event start"}</button>` : ""}${a && !a.timeIn && status === "Upcoming" ? `<button class="secondary" onclick="cancel(${e.id})">Cancel registration</button>` : ""}</article>`;
              })
              .join("")
          : '<div class="panel empty">No events yet. Check back soon.</div>';
      }
      async function register(id) {
        let f = $(`proof-${id}`).files[0];
        if (!f) {
          alert("A photo from the event is required.");
          return;
        }
        if (!f.type.startsWith("image/") || f.size > 1024 * 1024) {
          alert("Select an image file up to 1 MB.");
          return;
        }
        let data = await new Promise((resolve, reject) => {
          let r = new FileReader();
          r.onload = () => resolve(r.result);
          r.onerror = reject;
          r.readAsDataURL(f);
        });
        if (system.registerSelf(id, data)) {
          toast("Photo proof saved and registration complete.");
          draw();
        }
      }
      function cancel(id) {
        if (confirm("Cancel this registration?")) {
          system.unregisterSelf(id);
          draw();
        }
      }
      draw();
      //setInterval(draw, 15000);
    </script>
  </body>
</html>
