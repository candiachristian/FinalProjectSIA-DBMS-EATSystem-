<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Attendance</title>

    <link rel="stylesheet" href="style.css" />
    <script src="app.js"></script>
  </head>

  <body>
    <header>
      <div class="brand">
        <span class="brand-mark">📝</span>
        <h1>Attendance &amp; student registration</h1>
      </div>

      <a href="index.html" style="color: white">Dashboard</a>
    </header>

    <main class="wrap">
      <section class="panel">
        <label for="event">Select event</label>

        <select id="event" onchange="draw()">
          <option value="">Choose an event…</option>
        </select>

        <div id="content"></div>
      </section>
    </main>

    <script>
      requireAdmin();

      (async () => {
        const events = {};

        const asLocal = (event) => ({
          date: event.event_date,
          start: event.start_time,
          end: event.end_time,
        });

        async function loadEvents() {
          const requestedEventId = new URLSearchParams(location.search).get(
            "event",
          );
          const eventList = await eatApi.events();

          $("event").innerHTML = '<option value="">Choose an event…</option>';

          eventList.forEach((event) => {
            events[event.event_id] = event;

            $("event").insertAdjacentHTML(
              "beforeend",
              `<option value="${event.event_id}">
                ${esc(event.event_name)} · ${esc(String(event.event_date).slice(0, 10))} · ${fmt12(event.start_time)}
              </option>`,
            );
          });

          if (requestedEventId && events[requestedEventId]) {
            $("event").value = requestedEventId;
          }
        }

        function rowHtml(row, completed) {
          const attendanceStatus =
            row.attendance_status ||
            (completed ? "Not recorded" : "Registered");

          const actions = [];

          if (row.attendance_id === null) {
            actions.push(
              `<button data-act="record" data-reg="${row.registration_id}">Record time-in</button>`,
            );
            actions.push(
              `<button data-act="absent" data-reg="${row.registration_id}">Absent</button>`,
            );
          } else {
            actions.push(
              `<button data-act="edit" data-att="${row.attendance_id}" data-status="${esc(attendanceStatus)}">Edit</button>`,
            );
          }

          actions.push(
            row.registration_status === "Registered"
              ? `<button data-act="cancel" data-reg="${row.registration_id}">Cancel registration</button>`
              : `<button data-act="reregister" data-reg="${row.registration_id}">Re-register</button>`,
          );

          actions.push(
            `<button class="danger" data-act="remove" data-reg="${row.registration_id}">Remove</button>`,
          );

          const timeIn = row.time_in
            ? fmt12(String(row.time_in).slice(11, 16))
            : "—";
          const proofLink = row.proof_image_path
            ? `<a href="${esc(row.proof_image_path)}" target="_blank" rel="noopener">View photo</a>`
            : "—";

          return `
            <tr>
              <td>${esc(row.student_number || "")}</td>
              <td>${esc(row.first_name || "")} ${esc(row.last_name || "")}</td>
              <td>${esc(row.department_name || "")}</td>
              <td>
                ${esc(row.program_name || "")}
                ${esc([row.year_level, row.section].filter(Boolean).join(" - "))}
              </td>
              <td>${timeIn}</td>
              <td>${proofLink}</td>
              <td>
                <span class="badge ${esc(attendanceStatus)}">
                  ${esc(attendanceStatus)}
                </span>
              </td>
              <td>
                <span class="badge ${esc(row.registration_status || "")}">
                  ${esc(row.registration_status || "")}
                </span>
              </td>
              <td>${actions.join(" ")}</td>
            </tr>
          `;
        }

        window.draw = async function () {
          const eventId = $("event").value;
          const event = events[eventId];

          if (!event) {
            $("content").innerHTML = "";
            return;
          }

          let rows;

          try {
            rows = await eatApi.roster(eventId);
          } catch (error) {
            toast(error.message);
            return;
          }

          const countStatus = (status) =>
            rows.filter((row) => row.attendance_status === status).length;

          const stats = {
            Registered: rows.filter(
              (row) => row.registration_status === "Registered",
            ).length,
            Present: countStatus("Present"),
            Late: countStatus("Late"),
            Absent: countStatus("Absent"),
          };

          const registrationOpen = system.canRegister(asLocal(event));
          const phase = eventStatus(asLocal(event));

          $("content").innerHTML = `
            <div class="stats">
              ${Object.entries(stats)
                .map(
                  ([label, number]) =>
                    `<div class="stat"><b>${number}</b> ${label}</div>`,
                )
                .join("")}
            </div>

            <section class="panel" style="margin: 12px 0; background: #f6f9ff">
              <div class="title-row">
                <div>
                  <h3>Register a student</h3>
                  <p class="hint">
                    Enter the student's details and attach photo proof.
                    Registration is allowed only while this event is in progress.
                  </p>
                </div>

                <span class="badge ${registrationOpen ? "Ongoing" : phase}">
                  ${registrationOpen ? "Registration open" : phase}
                </span>
              </div>

              ${
                registrationOpen
                  ? `
                    <form id="reg-form" enctype="multipart/form-data">
                      <label for="sid">Student ID *</label>
                      <input
                        id="sid"
                        required
                        placeholder="e.g., 2025-12345"
                      />

                      <label for="first-name">First name *</label>
                      <input
                        id="first-name"
                        required
                        placeholder="Student first name"
                      />

                      <label for="last-name">Last name *</label>
                      <input
                        id="last-name"
                        required
                        placeholder="Student last name"
                      />

                      <label for="middle-name">Middle name</label>
                      <input
                        id="middle-name"
                        placeholder="Optional"
                      />

                      <label for="department">Department *</label>
                      <select id="department" required>
                        <option value="">Loading departments...</option>
                      </select>


                      <label for="program">Program / course</label>
                      <input
                        id="program"
                        required
                        placeholder="e.g., BS Information Technology"
                      />

                      <label for="year-section">Year &amp; section</label>
                      <input
                        id="year-section"
                        required
                        placeholder="e.g., 2 - A"
                      />

                      <label for="proof">Photo proof from the event *</label>
                      <input
                        id="proof"
                        name="proof"
                        type="file"
                        accept="image/*"
                        required
                      />

                      <p class="hint">
                        Image file up to 1 MB. The photo is stored with this
                        event registration.
                      </p>

                      <div class="actions">
                        <button type="submit">
                          Register student &amp; record time-in
                        </button>
                      </div>
                    </form>
                  `
                  : `
                    <div class="notice warn">
                      Student registration opens at ${fmt12(event.start_time)}
                      on ${esc(String(event.event_date).slice(0, 10))} and closes
                      at ${fmt12(event.end_time)}. It is unavailable right now.
                    </div>
                  `
              }
            </section>

            <h3>Registered students</h3>

            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Student ID</th>
                    <th>Name</th>
                    <th>Department</th>
                    <th>Program / section</th>
                    <th>Time in</th>
                    <th>Proof</th>
                    <th>Status</th>
                    <th>Registration</th>
                    <th>Action</th>
                  </tr>
                </thead>

                <tbody>
                  ${
                    rows.length
                      ? rows
                          .map((row) => rowHtml(row, phase === "Completed"))
                          .join("")
                      : '<tr><td colspan="9">No students registered yet.</td></tr>'
                  }
                </tbody>
              </table>
            </div>
          `;

          const form = $("reg-form");

          if (form) {
            const departmentSelect = $("department");

            async function loadDepartments() {
              try {
                const departments = await eatApi.departments();

                departmentSelect.innerHTML = `
        <option value="">Select a department</option>
      `;

                departments.forEach((department) => {
                  const option = document.createElement("option");

                  option.value = department.department_name;
                  option.textContent = department.department_name;

                  departmentSelect.appendChild(option);
                });
              } catch (error) {
                departmentSelect.innerHTML = `
        <option value="">Could not load departments</option>
      `;

                departmentSelect.disabled = true;

                toast(
                  "Could not load departments. Please check the departments API.",
                );
              }
            }

            loadDepartments();

            form.onsubmit = async (eventObject) => {
              eventObject.preventDefault();

              try {
                const yearSection = $("year-section").value.trim();

                const yearSectionMatch = /^([1-5])\s*-\s*(.{1,20})$/.exec(
                  yearSection,
                );

                if (!yearSectionMatch) {
                  throw new Error(
                    "Enter year and section as, for example, 2 - A.",
                  );
                }

                if (!$("department").value) {
                  throw new Error("Please select a department.");
                }

                const studentDetails = {
                  studentNumber: $("sid").value.trim(),
                  firstName: $("first-name").value.trim(),
                  middleName: $("middle-name").value.trim(),
                  lastName: $("last-name").value.trim(),

                  departmentName: $("department").value.trim(),

                  programName: $("program").value.trim(),
                  yearLevel: Number(yearSectionMatch[1]),
                  section: yearSectionMatch[2].trim(),
                };

                const photo = $("proof").files[0];

                if (!photo) {
                  throw new Error("Please select the required photo proof.");
                }

                if (
                  ![
                    "image/jpeg",
                    "image/png",
                    "image/gif",
                    "image/webp",
                  ].includes(photo.type)
                ) {
                  throw new Error(
                    "Photo proof must be a JPEG, PNG, GIF, or WEBP image.",
                  );
                }

                if (photo.size > 1024 * 1024) {
                  throw new Error("The photo must be 1 MB or smaller.");
                }

                const registration = await eatApi.register(
                  studentDetails,
                  Number(eventId),
                  photo,
                );

                await eatApi.recordAttendance(registration.registrationId);

                toast(
                  "Photo proof saved; student registered and time-in recorded.",
                );

                await window.draw();
              } catch (error) {
                toast(error.message);
              }
            };
          }
        };

        $("content").onclick = async (eventObject) => {
          const button = eventObject.target.closest("button[data-act]");

          if (!button) return;

          const action = button.dataset.act;
          const registrationId = Number(button.dataset.reg);
          const attendanceId = Number(button.dataset.att);

          try {
            if (action === "record") {
              await eatApi.recordAttendance(registrationId);
              toast("Time-in recorded.");
            } else if (action === "absent") {
              await eatApi.recordAttendance(registrationId, "Absent");
              toast("Marked absent.");
            } else if (action === "edit") {
              const status = prompt(
                "New status (Present, Late or Absent):",
                button.dataset.status,
              );

              if (!status) return;

              const payload = { status };

              if (status !== "Absent") {
                const timeIn = prompt(
                  "Time in (YYYY-MM-DD HH:mm), leave empty to keep:",
                  "",
                );

                if (timeIn) payload.timeIn = timeIn;
              }

              await eatApi.editAttendance(attendanceId, payload);
              toast("Attendance updated.");
            } else if (action === "cancel") {
              await eatApi.setRegistrationStatus(registrationId, "Cancelled");
              toast("Registration cancelled.");
            } else if (action === "reregister") {
              await eatApi.setRegistrationStatus(registrationId, "Registered");
              toast("Student re-registered.");
            } else if (action === "remove") {
              if (!confirm("Remove this registration?")) return;

              await eatApi.removeRegistration(registrationId);
              toast("Registration removed.");
            }

            await window.draw();
          } catch (error) {
            toast(error.message);
          }
        };

        try {
          await loadEvents();
          await window.draw();
        } catch (error) {
          toast(error.message);
        }
      })();
    </script>
  </body>
</html>
