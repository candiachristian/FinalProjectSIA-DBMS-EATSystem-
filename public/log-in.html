<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Administrator Sign In · Events</title>

  <link rel="stylesheet" href="style.css">
  <script src="app.js"></script>
</head>

<body>
  <main class="panel auth">
    <div class="brand">
      <span class="brand-mark">📝</span>
      <strong>NORSU · Events</strong>
    </div>

    <h2>Administrator sign in</h2>
    <p class="hint">
      Manage events and record student attendance.
    </p>

    <form id="login-form">
      <label for="username">Admin username</label>
      <input
        id="username"
        name="username"
        type="text"
        autocomplete="username"
        placeholder="Enter administrator username"
        required
      >

      <label for="password">Password</label>
      <input
        id="password"
        name="password"
        type="password"
        autocomplete="current-password"
        placeholder="Enter administrator password"
        required
      >

      <button type="submit" style="width: 100%; margin-top: 14px">
        Sign in
      </button>
    </form>

    <p id="login-error" class="notice error hidden">
      Invalid administrator username or password.
    </p>
  </main>

  <script>
    document.getElementById('login-form').addEventListener('submit', event => {
      event.preventDefault();
      login();
    });
  </script>
</body>
</html>
