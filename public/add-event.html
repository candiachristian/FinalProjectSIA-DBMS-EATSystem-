<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Create event · Events</title>
    <link rel="stylesheet" href="style.css" />
    <script src="app.js"></script>
  </head>

  <body>
    <header>
      <div class="brand">
        <span class="brand-mark">📝</span>
        <h1>Events · Admin</h1>
      </div>

      <a href="index.html" style="color: white">Dashboard</a>
    </header>

    <main class="wrap narrow">
      <section class="hero">
        <h2>Create an event</h2>
        <p>
          Set a clear event window so students know when registration is open.
        </p>
      </section>

      <section class="panel">
        <form id="form">
          <label>Event name *</label>
          <input
            id="name"
            required
            maxlength="100"
            placeholder="e.g. Campus Sports Festival"
          />
          <label for="category">Category *</label>
          <select id="category" required>
            <option value="">Loading categories…</option>
          </select>

          <div class="row">
            <div>
              <label>Date *</label><input id="date" type="date" required />
            </div>

            <div>
              <label>Venue *</label
              ><input id="venue" required placeholder="Building / room" />
            </div>
          </div>

          <div class="row">
            <div>
              <label>Starts *</label><input id="start" type="time" required />
            </div>

            <div>
              <label>Ends *</label><input id="end" type="time" required />
            </div>
          </div>
          <label>On-time grace period (minutes)</label>
          <input id="grace" type="number" min="0" max="180" value="15" />
          <p class="hint">
            Student registration and photo-proof submission are available only
            during the event start-to-end window.
          </p>

          <div class="actions">
            <button type="submit">Save event</button>
            <a
              class="button"
              href="index.html"
              style="background: #edf3fb; color: #284362; box-shadow: none"
              >Cancel
            </a>
          </div>
        </form>
      </section>
    </main>

    <script>
      requireRole("admin");

      const categorySelect = $("category");
      const eventForm = $("form");

      async function loadCategories() {
        categorySelect.innerHTML =
          '<option value="">Loading categories…</option>';

        try {
          const response = await fetch("/api/event-categories");
          const result = await response.json();

          if (!response.ok || !result.success) {
            throw new Error(result.message || "Could not load categories.");
          }

          const categories = result.data || [];

          categorySelect.innerHTML =
            '<option value="">Select a category</option>' +
            categories
              .map(
                (category) => `
          <option value="${Number(category.category_id)}">
            ${escapeHtml(category.category_name)}
          </option>
        `,
              )
              .join("");

          if (categories.length === 0) {
            categorySelect.innerHTML =
              '<option value="">No categories available</option>';
          }
        } catch (error) {
          console.error("Could not load categories:", error);
          categorySelect.innerHTML =
            '<option value="">Could not load categories</option>';
          alert(
            "Could not load event categories. Check the API and try again.",
          );
        }
      }

      function escapeHtml(value) {
        return String(value ?? "").replace(
          /[&<>"']/g,
          (character) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[character],
        );
      }

      eventForm.addEventListener("submit", async (event) => {
        event.preventDefault();

        const payload = {
          eventName: $("name").value.trim(),
          eventDate: $("date").value,
          startTime: $("start").value,
          endTime: $("end").value,
          venue: $("venue").value.trim(),
          gracePeriodMinutes: Number($("grace").value),
          categoryId: Number(categorySelect.value),
        };

        if (!payload.categoryId) {
          alert("Please select an event category.");
          return;
        }

        try {
          const response = await fetch("/api/events", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(payload),
          });

          const result = await response.json();

          if (!response.ok || !result.success) {
            throw new Error(result.message || "Could not create event.");
          }

          toast("Event created.");
          setTimeout(() => {
            window.location.href = "show-events.html";
          }, 650);
        } catch (error) {
          console.error("Create event error:", error);
          alert(error.message || "Could not create event.");
        }
      });

      loadCategories();
    </script>
  </body>
</html>
